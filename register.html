<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create your link — AnonAsk</title>
  <meta name="description" content="Claim your handle and start receiving anonymous messages." />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="setup-banner">
    Supabase keys not added yet — open <b>js/supabase-config.js</b> and paste your Project URL + anon key.
  </div>

  <main id="main" class="center-screen">
    <div class="auth-shell">
      <div class="auth-head">
        <span class="veil lg" id="veil-slot"></span>
        <h1>Claim your handle</h1>
        <p>This becomes your shareable link. Friends send you anonymous messages — you never see who.</p>
      </div>

      <form class="card auth-card" id="register-form" novalidate>
        <div class="field">
          <label for="display-name">Display name</label>
          <input class="input" id="display-name" type="text" autocomplete="nickname"
                 placeholder="How your page greets people" maxlength="40" />
        </div>

        <div class="field">
          <label for="handle">Your handle</label>
          <div class="input-prefixed">
            <span class="prefix">?u=</span>
            <input class="input" id="handle" type="text" inputmode="latin"
                   autocapitalize="off" autocomplete="off" spellcheck="false"
                   placeholder="righteous" maxlength="20" required />
          </div>
          <p class="field-note" id="handle-note"></p>
          <div class="link-preview-box">…/send.html?u=<b id="link-preview">your-name</b></div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" autocomplete="email"
                 placeholder="you@email.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" autocomplete="new-password"
                 placeholder="At least 6 characters" minlength="6" required />
        </div>

        <div class="form-error hidden" id="form-error" role="alert"></div>

        <div class="submit-row">
          <button class="btn btn-gold btn-block" id="submit-btn" type="submit">Create my link</button>
        </div>
      </form>

      <p class="auth-alt">Already have a room? <a href="login.html">Log in</a></p>
      <div style="text-align:center"><a class="auth-back" href="index.html">← Back home</a></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("veil-slot").innerHTML = window.VEIL_SVG;
    initRegister();
  </script>
</body>
</html>
